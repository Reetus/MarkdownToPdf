name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build MarkdownToPdf.slnx -c Release

      - name: Test
        run: dotnet test MarkdownToPdf.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack MarkdownToPdf.slnx -c Release --no-build

      - name: Smoke test the tool
        shell: bash
        run: |
          dotnet tool install MarkdownToPdf.Tool --tool-path ./tool --add-source artifacts/packages
          ./tool/markdowntopdf samples/showcase.md -o showcase.pdf --toc

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            showcase.pdf
